name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pre:
        description: "Candidate label (rc), none for stable promotion, or empty for stable defaults"
        type: string
        default: ""
      set:
        description: "Exact package=version targets, one per line (for example shelf=1.1.1)"
        type: string
        default: ""
      bump:
        description: "Bump overrides, one per line (for example shelf=patch)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  release:
    uses: tylerbutler/actions/.github/workflows/trellis-release.yml@40269ed66210884257a06ab9c0f7e2c4f987af05 # ratchet:tylerbutler/actions/.github/workflows/trellis-release.yml@main
    with:
      trellis_version: "1.3.0"
      release_mode: hex
      base: main
      release_branch: release/pending
      gleam_version: "1.19.2"
      erlang_version: "27.2.1"
      pre: ${{ inputs.pre || '' }}
      set: ${{ inputs.set || '' }}
      bump: ${{ inputs.bump || '' }}
    secrets:
      app_id: ${{ secrets.RELEASE_APP_ID }}
      app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      hex_api_key: ${{ secrets.HEXPM_API_KEY }}
