name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install licence_audit
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # ratchet:jdx/mise-action@v3
        with:
          install_args: github:tylerbutler/licence_audit

      - name: Run CI checks
        run: |
          just audit-check
          rm -f priv/shelf.cdx.json
          gleam format --check src test examples/src
          gleam check
          gleam test
          gleam build --warnings-as-errors
          (cd examples && gleam check)

      - name: Generate Shelf SBOM
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          gleam deps download
          mkdir -p priv
          licence_audit sbom --reproducible --output=priv/shelf.cdx.json

      - name: Verify Shelf SBOM and Hex archive
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          licence_audit sbom --reproducible --output=build/shelf-check.cdx.json
          cmp priv/shelf.cdx.json build/shelf-check.cdx.json
          rm build/shelf-check.cdx.json
          gleam export hex-tarball
          python3 test/sbom_test.py

      - name: Upload Shelf SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: shelf-sbom
          path: priv/shelf.cdx.json
          if-no-files-found: error

      - name: Upload Shelf Hex archive
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && github.workflow_ref == 'tylerbutler/shelf/.github/workflows/ci.yml@refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: shelf-hex
          path: build/shelf-*.tar
          if-no-files-found: error

  attest:
    name: Attest build artifacts
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'tylerbutler/shelf/.github/workflows/ci.yml@refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Shelf SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: shelf-sbom
          path: artifacts/sbom

      - name: Download Shelf Hex archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: shelf-hex
          path: artifacts/hex

      - name: Attest Shelf archive and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            artifacts/hex/shelf-*.tar
            artifacts/sbom/shelf.cdx.json

  docs:
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build documentation
        run: just docs
