package = "shelf"
kind = "Fixed"
body = "Preserve fold callback exceptions instead of converting them to ShelfError. All three table types retain the original Erlang class, reason, and stack trace, even if the callback closes the table before raising. Closed-table traversal still returns TableClosed. Compatibility correction: callers that relied on callback exceptions becoming ShelfError must handle expected failures in the callback or at an application exception boundary."
